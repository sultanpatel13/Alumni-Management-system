{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Edit Event</h2>
  
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Title *</label>
      <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="4">{{ event.description or '' }}</textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Start Time * (YYYY-MM-DD HH:MM)</label>
        <input type="text" name="start_time" class="form-control" 
               value="{{ event.start_time.strftime('%Y-%m-%d %H:%M') if event.start_time else '' }}" 
               placeholder="2024-12-25 14:00" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">End Time (YYYY-MM-DD HH:MM)</label>
        <input type="text" name="end_time" class="form-control" 
               value="{{ event.end_time.strftime('%Y-%m-%d %H:%M') if event.end_time else '' }}" 
               placeholder="2024-12-25 16:00">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" value="{{ event.location or 'Online' }}">
    </div>

    <div class="mb-3">
      <div class="form-check">
        <input type="checkbox" name="is_online" class="form-check-input" {% if event.is_online %}checked{% endif %}>
        <label class="form-check-label">Online Event</label>
      </div>
    </div>

    <div class="mb-3">
      <div class="form-check">
        <input type="checkbox" name="is_free" class="form-check-input" {% if event.is_free %}checked{% endif %}>
        <label class="form-check-label">Free Event</label>
      </div>
    </div>

    <div class="mb-3">
      <button type="submit" class="btn btn-primary">Update Event</button>
      <a href="{{ url_for('events_list') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
