{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-lg-6 reveal">
    <div class="card p-4">
      <h2 class="mb-3">Login</h2>
      <p class="text-muted mb-4">Welcome back. Continue building your alumni network.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password" placeholder="Enter password">
            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password" title="Show password" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <div class="d-flex justify-content-between mt-3">
        <a href="{{ url_for('signup') }}" class="text-decoration-none">Create account</a>
        <a href="{{ url_for('login_google') }}" class="text-decoration-none">Mock Google Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
