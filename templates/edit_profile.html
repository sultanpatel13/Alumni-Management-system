{% extends "base.html" %}
{% block content %}
<h2>Edit Profile</h2>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Name *</label>
    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Skills (comma-separated) *</label>
    <input type="text" name="skills" class="form-control" value="{{ user.skills }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Career Interests (optional)</label>
    <input type="text" name="career_interests" class="form-control" value="{{ user.career_interests or '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Industry (optional)</label>
    <input type="text" name="industry" class="form-control" value="{{ user.industry or '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Years of Experience (optional)</label>
    <input type="number" name="years_experience" class="form-control"
           value="{{ user.years_experience if user.years_experience is not none }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Current Company (optional)</label>
    <input type="text" name="current_company" class="form-control" value="{{ user.current_company or '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Education (optional)</label>
    <input type="text" name="education" class="form-control" value="{{ user.education or '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Bio (optional)</label>
    <textarea name="bio" class="form-control" rows="3">{{ user.bio or '' }}</textarea>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">City (optional)</label>
      <input type="text" name="location_city" class="form-control" value="{{ user.location_city or '' }}">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">State (optional)</label>
      <input type="text" name="location_state" class="form-control" value="{{ user.location_state or '' }}">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Country (optional)</label>
      <input type="text" name="location_country" class="form-control" value="{{ user.location_country or '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Mentoring Preference (optional)</label>
    <select name="mentoring_preference" class="form-select">
      <option value="" {% if not user.mentoring_preference %}selected{% endif %}>-- Select --</option>
      <option value="yes" {% if user.mentoring_preference == 'yes' %}selected{% endif %}>Yes, I want to mentor</option>
      <option value="no" {% if user.mentoring_preference == 'no' %}selected{% endif %}>Not right now</option>
      <option value="maybe" {% if user.mentoring_preference == 'maybe' %}selected{% endif %}>Maybe / Depends</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Save Changes</button>
  <a href="{{ url_for('profile') }}" class="btn btn-secondary">Cancel</a>
{% endblock %}
